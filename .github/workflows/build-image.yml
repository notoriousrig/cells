name: build-image

# Builds the Cells binary from source (compile mode of the upstream
# buildx-dockerfile — plain `go build`, frontend dist is committed & go:embed'd)
# and pushes a runnable image to GHCR. Triggered on pushes to the crbox branch
# (our downstream working branch) or manually.

on:
  push:
    branches: [crbox]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cells
          tags: |
            type=raw,value=crbox
            type=sha,format=short

      - name: Build stamp
        id: stamp
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/images/cells/buildx-dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_MODE=compile
            DOCKER_ENTRYPOINT_SRC_DIR=tools/docker/images/cells
            VERSION=5.0.2-crbox
            GIT_REV=${{ github.sha }}
            BUILD_STAMP=${{ steps.stamp.outputs.ts }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
